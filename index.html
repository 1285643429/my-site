<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的站</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#0b0b0d;--card:#17171b;--line:#26262c;--txt:#eaeaea;--dim:#8a8a94;--acc:#ff5a5f;--acc2:#ff9f43;--gold:#ffc44d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,system-ui,sans-serif;padding-bottom:76px}
img{display:block}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-size:19px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#1c1c21;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:14px;min-width:0}
.search input::placeholder{color:var(--dim)}

.banner{position:relative;margin:12px 14px 0;border-radius:16px;overflow:hidden;background:#141418}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;aspect-ratio:16/10}
.slide img{width:100%;height:100%;object-fit:cover}
.slide .ov{position:absolute;inset:auto 0 0 0;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.slide .st{font-size:19px;font-weight:800;text-shadow:0 2px 8px #000}
.slide .sd{font-size:12px;color:#c9c9d1;margin-top:3px}
.dots{position:absolute;left:0;right:0;bottom:8px;display:flex;gap:6px;justify-content:center}
.dot{width:6px;height:6px;border-radius:99px;background:rgba(255,255,255,.35);transition:.25s}
.dot.on{width:18px;background:var(--acc2)}

.notice{margin:12px 14px 0;display:flex;align-items:center;gap:8px;background:#17171b;border:1px solid var(--line);border-radius:10px;padding:8px 12px;overflow:hidden}
.ntag{flex:0 0 auto;background:linear-gradient(90deg,var(--acc2),#ff7a2f);color:#1a1200;font-size:11px;font-weight:800;padding:2px 8px;border-radius:6px}
.nmarq{flex:1;overflow:hidden;white-space:nowrap;font-size:12px;color:#a8a8b2}
.nmarq span{display:inline-block;padding-left:100%;animation:mv 18s linear infinite}
@keyframes mv{to{transform:translateX(-100%)}}

.sec{padding:18px 14px 0}
.sh{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.sh:before{content:"";width:3px;height:16px;border-radius:2px;background:linear-gradient(180deg,var(--acc2),var(--acc))}
.sh h2{margin:0;font-size:16px;font-weight:800}
.sh .more{margin-left:auto;font-size:12px;color:var(--dim)}

.tags{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.tags::-webkit-scrollbar{display:none}
.tag{flex:0 0 auto;padding:7px 16px;border-radius:999px;background:#1c1c21;border:1px solid var(--line);font-size:13px;color:var(--dim);position:relative}
.tag.on{color:#fff;border-color:var(--acc2);background:#241d17}
.tag.on:after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:-6px;width:18px;height:3px;border-radius:2px;background:var(--acc2)}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;transition:transform .15s}
.card:active{transform:scale(.97)}
.card .cover{position:relative}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#101014}
.card .t{font-size:13px;font-weight:600;line-height:1.35;padding:9px 10px 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:11px;color:var(--dim);padding:0 10px 11px;display:flex;gap:8px}
.badge{position:absolute;top:8px;left:8px;background:rgba(255,90,95,.95);color:#fff;font-size:10px;font-weight:800;padding:3px 8px;border-radius:6px}
.score{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.72);color:var(--gold);font-size:11px;font-weight:800;padding:2px 7px;border-radius:6px}
.epsc{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.74);color:#e6e6ee;font-size:11px;font-weight:600;padding:2px 8px;border-radius:6px}
.play{position:absolute;right:8px;bottom:8px;width:26px;height:26px;border-radius:50%;background:rgba(255,90,95,.92);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}

.ad{margin:14px;min-height:64px;display:flex;align-items:center;justify-content:center;background:#141418;border:1px dashed var(--line);border-radius:12px;color:#4a4a55;font-size:12px;overflow:hidden}

.detail{position:fixed;inset:0;background:var(--bg);z-index:90;overflow-y:auto;display:none}
.detail.show{display:block}
.dtop{position:relative;height:200px;overflow:hidden}
.dtop img{width:100%;height:100%;object-fit:cover;filter:brightness(.55)}
.dtop .back{position:absolute;top:14px;left:14px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;border:0;font-size:16px}
.dtop .dt{position:absolute;left:16px;right:16px;bottom:14px}
.dtop .dt h1{margin:0 0 6px;font-size:20px;font-weight:800;text-shadow:0 2px 8px #000}
.dtop .dt .row{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:#cfcfd8}
.dtop .dt .row span{background:rgba(255,255,255,.12);padding:2px 8px;border-radius:6px}
.dsec{padding:18px 14px 6px}
.dsec h3{margin:0 0 12px;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.dsec h3:before{content:"";width:3px;height:15px;border-radius:2px;background:linear-gradient(180deg,var(--acc2),var(--acc))}
.epsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:9px;padding:0 14px 40px}
.ep{aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:#1c1c21;border:1px solid var(--line);border-radius:10px;font-size:14px;color:#c9c9d1;font-weight:600}
.ep.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border-color:transparent}

.player{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}
.player.hide{display:none}
.pbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;flex:0 0 auto;background:#000}
.pbar button{background:#1c1c21;border:1px solid var(--line);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px}
.pbar .pt{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pframe{flex:1;width:100%;border:0;background:#000}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(17,17,21,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
nav a.on{color:var(--acc)}
  nav .ico{font-size:19px;line-height:1}
.empty{text-align:center;color:var(--dim);padding:50px 20px;font-size:14px}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <div class="logo">我的站</div>
    <div class="search">
      <span style="color:#5a5a66">&#128269;</span>
      <input id="q" placeholder="搜索剧名…">
    </div>
  </div>
</header>

<div class="banner">
  <div class="slides" id="slides"></div>
  <div class="dots" id="dots"></div>
</div>

<div class="notice">
  <span class="ntag">公告</span>
  <div class="nmarq"><span>本站每日更新，收藏不迷路；播放异常请切换备用线路。</span></div>
</div>

<div class="sec">
  <div class="sh"><h2>热门标签</h2></div>
  <div class="tags" id="tags"></div>
</div>

<div class="sec">
  <div class="sh"><h2>精选推荐</h2><span class="more" id="cnt"></span></div>
  <div class="grid" id="grid"></div>
</div>

<div class="ad">广告位 300×250</div>

<nav>
  <a class="on"><span class="ico">&#127968;</span>首页</a>
  <a><span class="ico">&#128293;</span>热门</a>
  <a><span class="ico">&#127381;</span>最新</a>
  <a><span class="ico">&#11088;</span>收藏</a>
</nav>

<div class="detail" id="detail">
  <div class="dtop">
    <img id="dcover" src="" alt="">
    <button class="back" id="dback">&#10094;</button>
    <div class="dt">
      <h1 id="dtitle"></h1>
      <div class="row" id="dmeta"></div>
    </div>
  </div>
  <div class="dsec"><h3>选集</h3></div>
  <div class="epsgrid" id="epsgrid"></div>
</div>

<div class="player hide" id="player">
  <div class="pbar">
    <button id="back">&#10005; 返回</button>
    <div class="pt" id="ptitle"></div>
  </div>
  <iframe id="pframe" class="pframe" allowfullscreen allow="autoplay; fullscreen"></iframe>
</div>

<script>
var BANNERS = [
  { img:"https://picsum.photos/900/560?11", title:"好漫不断 追剧不停", desc:"每日更新，收藏不迷路" },
  { img:"https://picsum.photos/900/560?12", title:"精选高分合集", desc:"评分 9.0 以上精选" },
  { img:"https://picsum.photos/900/560?13", title:"新片速递", desc:"刚上线，抢先看" ｝,
];
var VIDEOS = [
  {
    id:"chenlun",
    title:"沉沦",
    thumb:"https://picsum.photos/640/360?21",
    tag:"热门",
    score:"9.2",
    isNew:true,
    desc:"",
    episodes:[
      "https://streamtape.com/e/Y73D9mRybYSvWro/",
      "https://streamtape.com/e/myzBPv91gJub02O/",
    ]
  }
];

var slides=document.getElementById('slides'), dots=document.getElementById('dots');
var tagsEl=document.getElementById('tags'), grid=document.getElementById('grid');
var q=document.getElementById('q'), cnt=document.getElementById('cnt');
var player=document.getElementById('player'), pframe=document.getElementById('pframe'), ptitle=document.getElementById('ptitle');
var detail=document.getElementById('detail'), dcover=document.getElementById('dcover');
var dtitle=document.getElementById('dtitle'), dmeta=document.getElementById('dmeta'), epsgrid=document.getElementById('epsgrid');
var curCat='全部', curIdx=0, timer=null, curItem=null;

function esc(s){
    return String(s==null?'':s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

slides.innerHTML = BANNERS.map(function(b){
  return '<div class="slide"><img src="'+esc(b.img)+'" alt="">'+
    '<div class="ov"><div class="st">'+esc(b.title)+'</div><div class="sd">'+esc(b.desc)+'</div></div></div>';
}).join('');
dots.innerHTML = BANNERS.map(function(_,i){
  return '<span class="dot'+(i===0?' on':'')+'" data-i="'+i+'"></span>';
}).join('');

slides.addEventListener('scroll', function(){
  var i = Math.round(slides.scrollLeft / slides.clientWidth);
  if(i === curIdx) return;
  curIdx = i;
  Array.prototype.forEach.call(dots.children, function(d,j){ d.className='dot'+(j===i?' on':''); });
});

function autoSlide(){
  clearInterval(timer);
  timer = setInterval(function(){
    var i = (curIdx + 1) % BANNERS.length;
    slides.scrollTo({ left: i * slides.clientWidth, behavior:'smooth' });
  }, 4000);
}
autoSlide();
slides.addEventListener('touchstart', function(){ clearInterval(timer); }, {passive:true});
slides.addEventListener('touchend', autoSlide, {passive:true});

var tags=['全部'];
VIDEOS.forEach(function(v){ if(v.tag && tags.indexOf(v.tag)<0) tags.push(v.tag); });
tagsEl.innerHTML = tags.map(function(t){
  return '<div class="tag'+(t===curCat?' on':'')+'" data-c="'+esc(t)+'">'+esc(t)+'</div>';
}).join('');

tagsEl.addEventListener('click', function(e){
  var el=e.target.closest('.tag'); if(!el) return;
  curCat = el.dataset.c;
  Array.prototype.forEach.call(tagsEl.children, function(c){
    c.className='tag'+(c.dataset.c===curCat?' on':'');
  });
  render();
});

q.addEventListener('input', render);

function epCount(v){ return v.episodes ? v.episodes.length : 0; }

function render(){
  var kw = q.value.trim().toLowerCase();
  var list = VIDEOS.filter(function(v){
    var okC = curCat==='全部' || v.tag===curCat;
    var okK = !kw || v.title.toLowerCase().indexOf(kw)>=0;
    return okC && okK;
  });
  cnt.textContent = list.length + ' 个';

  if(!list.length){ grid.innerHTML='<div class="empty">没有找到内容</div>'; return; }

  var html='';
  for(var i=0;i<list.length;i++){
    var v=list[i];
    var n=epCount(v);
    html += '<div class="card" data-id="'+esc(v.id)+'"><div class="cover">'+
      '<img src="'+esc(v.thumb)+'" loading="lazy" alt="">'+
      (v.isNew?'<span class="badge">新上架</span>':'')+
      (v.score?'<span class="score">'+esc(v.score)+'分</span>':'')+
      (n?'<span class="epsc">全 '+n+' 集</span>':'')+
      '<span class="play">&#9654;</span>'+
      '</div>'+
      '<div class="t">'+esc(v.title)+'</div>'+
      '<div class="s"><span>'+esc(v.tag||'')+'</span><span>'+(n?('更新至 '+n+' 集'):'单集')+'</span></div>'+
      '</div>';
    if((i+1)%6===0){
      html += '<div class="ad" style="grid-column:1/-1">信息流广告位</div>';
    }
  }
  grid.innerHTML = html;
}

grid.addEventListener('click', function(e){
  var c=e.target.closest('.card'); if(!c) return;
  var v=VIDEOS.find(function(x){ return x.id===c.dataset.id; });
  if(!v) return;
  if(v.episodes && v.episodes.length){ openDetail(v); }
  else { play(v.title, v.embed); }
});

function openDetail(v){
  curItem = v;
  dcover.src = v.thumb;
  dtitle.textContent = v.title;
  var n = v.episodes.length;
  dmeta.innerHTML =
    (v.tag?'<span>'+esc(v.tag)+'</span>':'')+
    (v.score?'<span>'+esc(v.score)+'分</span>':'')+
    '<span>全 '+n+' 集</span>';
  var h='';
  for(var i=0;i<n;i++){
    h += '<div class="ep" data-i="'+i+'">'+(i+1)+'</div>';
  }
  epsgrid.innerHTML = h;
  detail.classList.add('show');
  detail.scrollTop = 0;
  document.body.style.overflow='hidden';
}

epsgrid.addEventListener('click', function(e){
  var el=e.target.closest('.ep'); if(!el || !curItem) return;
  var i = parseInt(el.dataset.i,10);
    Array.prototype.forEach.call(epsgrid.children, function(x){ x.className='ep'; });
  el.className='ep on';
  play(curItem.title + ' 第' + (i+1) + '集', curItem.episodes[i]);
});

document.getElementById('dback').addEventListener('click', function(){
  detail.classList.remove('show');
  document.body.style.overflow='';
});

function play(title, url){
  ptitle.textContent = title;
  pframe.src = url;
  player.classList.remove('hide');
  document.body.style.overflow='hidden';
}

document.getElementById('back').addEventListener('click', close);
function close(){
  player.classList.add('hide');
  pframe.src='';
  if(!detail.classList.contains('show')) document.body.style.overflow='';
}

window.addEventListener('popstate', function(){
  if(!player.classList.contains('hide')) close();
  else if(detail.classList.contains('show')){
    detail.classList.remove('show');
    document.body.style.overflow='';
  }
});

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的站</title>
<meta name="theme-color" content="#0b0b0d">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<style>
:root{--bg:#0b0b0d;--card:#17171b;--line:#26262c;--txt:#eaeaea;--dim:#8a8a94;--acc:#ff5a5f;--acc2:#ff9f43}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:15px/1.55 -apple-system,system-ui,sans-serif;padding-bottom:76px}
header{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:10px 14px}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-size:19px;font-weight:800;background:linear-gradient(90deg,var(--acc),var(--acc2));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;white-space:nowrap}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#1c1c21;border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--txt);font-size:14px;min-width:0}
.search input::placeholder{color:var(--dim)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;padding:6px 14px;border-radius:999px;background:#1c1c21;border:1px solid var(--line);font-size:13px;color:var(--dim)}
.cat.on{background:linear-gradient(90deg,var(--acc),var(--acc2));color:#fff;border-color:transparent;font-weight:600}
main{padding:8px 14px 20px}
.ad{margin:12px 0;min-height:60px;display:flex;align-items:center;justify-content:center;background:#141418;border:1px dashed var(--line);border-radius:12px;color:#4a4a55;font-size:12px;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--line);position:relative;transition:transform .15s}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#101014}
.card .meta{padding:9px 10px 11px}
.card .t{font-size:13px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .s{font-size:11px;color:var(--dim);margin-top:4px;display:flex;gap:8px}
.card .badge{position:absolute;top:8px;left:8px;background:rgba(255,90,95,.92);color:#fff;font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px}
.player{position:fixed;inset:0;background:#000;z-index:100;display:flex;flex-direction:column}
.player.hide{display:none}
.pbar{height:56px;display:flex;align-items:center;gap:12px;padding:0 14px;flex:0 0 auto;background:#000}
.pbar button{background:#1c1c21;border:1px solid var(--line);color:#fff;border-radius:999px;padding:8px 14px;font-size:13px}
  .pbar .pt{flex:1;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pframe{flex:1;width:100%;border:0;background:#000}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(17,17,21,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
nav a{flex:1;text-align:center;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:4px}
nav a.on{color:var(--acc)}
nav .ico{font-size:19px;line-height:1}
.empty{text-align:center;color:var(--dim);padding:60px 20px;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div class="logo">我的站</div>
    <div class="search">
      <span style="color:#5a5a66">🔍</span>
      <input id="q" placeholder="搜索视频…">
    </div>
  </div>
  <div class="cats" id="cats"></div>
</header>

<main>
  <!-- 广告位 1：顶部横幅 -->
  <div class="ad" id="adTop">广告位 728×90</div>

  <div class="grid" id="grid"></div>

  <!-- 广告位 4：底部 -->
  <div class="ad" id="adBottom">广告位 300×250</div>
</main>

<div class="player hide" id="player">
  <div class="pbar">
    <button id="back">✕ 返回</button>
    <div class="pt" id="ptitle"></div>
  </div>
  <iframe id="pframe" class="pframe" allowfullscreen allow="autoplay; fullscreen"></iframe>
</div>

<nav>
  <a class="on"><span class="ico">🏠</span>首页</a>
  <a><span class="ico">🔥</span>热门</a>
  <a><span class="ico">🆕</span>最新</a>
  <a><span class="ico">⭐</span>收藏</a>
</nav>

<script>
/* ===== 只改这里：视频列表 ===== */
var VIDEOS = [
  {
    id: "test001",
    title: "第一个视频标题",
    thumb: "https://picsum.photos/640/360?1",
    embed: "https://streamtape.com/e/test001/",
    tag: "热门",
    dur: "12:30",
    views: "1.2万"
  },
  {
    id: "test002",
    title: "第二个视频标题",
    thumb: "https://picsum.photos/640/360?2",
    embed: "https://streamtape.com/e/test002/",
    tag: "最新",
    dur: "08:15",
    views: "3.4千"
  }
];
/* ===== 下面不用动 ===== */

var grid   = document.getElementById('grid');
var cats   = document.getElementById('cats');
var q      = document.getElementById('q');
var player = document.getElementById('player');
var pframe = document.getElementById('pframe');
var ptitle = document.getElementById('ptitle');
var curCat = '全部';

var tags = ['全部'];
VIDEOS.forEach(function(v){ if(v.tag && tags.indexOf(v.tag) < 0) tags.push(v.tag); });
cats.innerHTML = tags.map(function(t){
  return '<div class="cat' + (t === curCat ? ' on' : '') + '" data-c="' + t + '">' + t + '</div>';
}).join('');

cats.addEventListener('click', function(e){
  var el = e.target.closest('.cat');
  if(!el) return;
  curCat = el.dataset.c;
  Array.prototype.forEach.call(cats.children, function(c){
    c.className = 'cat' + (c.dataset.c === curCat ? ' on' : '');
  });
  render();
});

q.addEventListener('input', render);

function render(){
  var kw = q.value.trim().toLowerCase();
  var list = VIDEOS.filter(function(v){
    var okC = curCat === '全部' || v.tag === curCat;
    var okK = !kw || v.title.toLowerCase().indexOf(kw) >= 0;
    return okC && okK;
  });

  if(!list.length){
    grid.innerHTML = '<div class="empty">没有找到视频</div>';
    return;
  }

  var html = '';
  for(var i = 0; i < list.length; i++){
    var v = list[i];
    html += '<div class="card" data-id="' + v.id + '">' +
      (v.tag ? '<span class="badge">' + v.tag + '</span>' : '') +
      '<img src="' + v.thumb + '" loading="lazy" alt="">' +
      '<div class="meta">' +
        '<div class="t">' + v.title + '</div>' +
        '<div class="s"><span>' + (v.views || '') + '</span><span>' + (v.dur || '') + '</span></div>' +
      '</div></div>';

    /* 广告位 2：每 6 个插一条信息流广告 */
    if((i + 1) % 6 === 0){
      html += '<div class="ad" style="grid-column:1/-1">信息流广告位</div>';
    }
  }
    grid.innerHTML = html;
}

grid.addEventListener('click', function(e){
  var card = e.target.closest('.card');
  if(!card) return;
  var v = VIDEOS.find(function(x){ return x.id === card.dataset.id; });
  if(!v) return;
  ptitle.textContent = v.title;
  pframe.src = v.embed;
  player.classList.remove('hide');
  document.body.style.overflow = 'hidden';
});

document.getElementById('back').addEventListener('click', close);

function close(){
  player.classList.add('hide');
  pframe.src = '';
  document.body.style.overflow = '';
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').catch(function(){});
}

render();
</script>
</body>
</html>
